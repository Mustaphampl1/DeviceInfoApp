<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Info Pro</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0e27;
    background-image:
      radial-gradient(circle at 0% 0%, rgba(124,77,255,0.15) 0%, transparent 50%),
      radial-gradient(circle at 100% 100%, rgba(79,195,247,0.15) 0%, transparent 50%);
    background-attachment: fixed;
    color: #e8eaf6;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 1.3rem;
    text-align: center;
    background: linear-gradient(90deg, #4fc3f7, #7c4dff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: #8892b0;
    font-size: 0.75rem;
    margin-bottom: 16px;
  }
  .debug {
    background: rgba(0,230,118,0.1);
    border: 1px solid rgba(0,230,118,0.3);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 12px;
    font-family: monospace;
    font-size: 0.7rem;
    color: #00e676;
  }
  .debug.error {
    background: rgba(255,82,82,0.1);
    border-color: rgba(255,82,82,0.3);
    color: #ff5252;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h3 {
    color: #4fc3f7;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 0.85rem;
    gap: 12px;
  }
  .row:last-child { border-bottom: none; }
  .label { color: #8892b0; }
  .value { font-weight: 600; text-align: right; word-break: break-word; max-width: 60%; }
  .good { color: #00e676; }
  .warn { color: #ff9100; }
  .bad { color: #ff5252; }
  .bar {
    height: 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 8px;
  }
  .fill {
    height: 100%;
    background: linear-gradient(90deg, #00e676, #64dd17);
    transition: width 0.5s;
  }
  .fill.orange { background: linear-gradient(90deg, #ff9100, #ffab00); }
  .fill.red { background: linear-gradient(90deg, #ff5252, #ff1744); }
  .fill.blue { background: linear-gradient(90deg, #4fc3f7, #7c4dff); }
</style>
</head>
<body>

<h1>📱 Device Info Pro</h1>
<p class="subtitle">Taarifa kamili za simu yako</p>

<div id="debug" class="debug">🔍 Inachunguza bridge...</div>
<div id="out">
  <div style="text-align:center;color:#8892b0;padding:40px 20px;">
    Inasoma taarifa...
  </div>
</div>

<script>
(function checkBridge() {
  const panel = document.getElementById('debug');
  const has = typeof AndroidDevice !== 'undefined' && typeof AndroidDevice.getDeviceInfo === 'function';
  if (has) {
    panel.className = 'debug';
    panel.innerHTML = '✅ Android bridge IPO!';
  } else {
    panel.className = 'debug error';
    panel.innerHTML = '❌ Bridge HAIPO! Fungua kwenye App.';
  }
})();

function loadAll() {
  try {
    if (typeof AndroidDevice === 'undefined') {
      throw new Error('Android bridge haipatikani.');
    }
    const d = JSON.parse(AndroidDevice.getDeviceInfo());

    const ramUsed = d.ramTotal - d.ramAvail;
    const ramPct = (ramUsed / d.ramTotal * 100).toFixed(1);
    const stPct = (d.storageInternalPercent || 0).toFixed(1);
    const batLvl = d.batteryLevel || 0;
    const ramCls = ramPct > 80 ? 'red' : ramPct > 60 ? 'orange' : '';
    const stCls = stPct > 80 ? 'red' : stPct > 60 ? 'orange' : '';
    const batCls = batLvl >= 60 ? '' : batLvl >= 30 ? 'orange' : 'red';

    document.getElementById('out').innerHTML = `
      <div class="card">
        <h3>📱 Kifaa</h3>
        <div class="row"><span class="label">Brand</span><span class="value">${d.brand}</span></div>
        <div class="row"><span class="label">Model</span><span class="value">${d.model}</span></div>
        <div class="row"><span class="label">Device</span><span class="value">${d.device}</span></div>
        <div class="row"><span class="label">Android</span><span class="value good">${d.androidVersion}</span></div>
        <div class="row"><span class="label">SDK</span><span class="value">${d.sdkInt}</span></div>
        <div class="row"><span class="label">Emulator</span><span class="value">${d.isEmulator ? 'Ndiyo' : 'Hapana'}</span></div>
      </div>

      <div class="card">
        <h3>⚙️ RAM (Halisi)</h3>
        <div class="row"><span class="label">Jumla</span><span class="value good">${d.ramTotalGBText}</span></div>
        <div class="row"><span class="label">Inatumika</span><span class="value">${formatBytes(ramUsed)}</span></div>
        <div class="row"><span class="label">Inapatikana</span><span class="value">${d.ramAvailText}</span></div>
        <div class="bar"><div class="fill ${ramCls}" style="width:${ramPct}%"></div></div>
      </div>

      <div class="card">
        <h3>💾 Storage (Internal)</h3>
        <div class="row"><span class="label">Jumla</span><span class="value good">${d.storageInternalTotalText}</span></div>
        <div class="row"><span class="label">Inatumika</span><span class="value">${d.storageInternalUsedText}</span></div>
        <div class="row"><span class="label">Inapatikana</span><span class="value">${d.storageInternalFreeText}</span></div>
        <div class="bar"><div class="fill ${stCls}" style="width:${stPct}%"></div></div>
      </div>

      <div class="card">
        <h3>🔋 Betri</h3>
        <div class="row"><span class="label">Kiwango</span><span class="value good">${batLvl}%</span></div>
        <div class="row"><span class="label">Hali</span><span class="value">${d.batteryCharging ? 'Inachaji ⚡' : 'Inatumika'}</span></div>
        <div class="row"><span class="label">Joto</span><span class="value">${d.batteryTemperature}°C</span></div>
        <div class="row"><span class="label">Afya</span><span class="value">${d.batteryHealth}</span></div>
        <div class="bar"><div class="fill ${batCls}" style="width:${batLvl}%"></div></div>
      </div>

      <div class="card">
        <h3>🖥️ Skrini</h3>
        <div class="row"><span class="label">Ukubwa</span><span class="value">${d.screenWidth} × ${d.screenHeight} px</span></div>
        <div class="row"><span class="label">Inchi</span><span class="value">${d.screenInches}"</span></div>
        <div class="row"><span class="label">DPI</span><span class="value">${d.screenDensityDpi}</span></div>
        <div class="row"><span class="label">Refresh</span><span class="value good">${d.screenRefreshRate} Hz</span></div>
      </div>

      <div class="card">
        <h3>🎛️ CPU</h3>
        <div class="row"><span class="label">Cores</span><span class="value">${d.cpuCores}</span></div>
        <div class="row"><span class="label">Model</span><span class="value">${d.cpuModel}</span></div>
        <div class="row"><span class="label">ABI</span><span class="value">${d.cpuAbiPrimary}</span></div>
      </div>

      <div class="card">
        <h3>🌐 Mtandao</h3>
        <div class="row"><span class="label">Aina</span><span class="value good">${d.networkType || 'N/A'}</span></div>
        <div class="row"><span class="label">WiFi SSID</span><span class="value">${d.wifiSSID || 'N/A'}</span></div>
        <div class="row"><span class="label">RSSI</span><span class="value">${d.wifiRssi || 'N/A'} dBm</span></div>
      </div>

      <div class="card">
        <h3>⏱️ Mfumo</h3>
        <div class="row"><span class="label">Uptime</span><span class="value good">${d.uptimeText}</span></div>
        <div class="row"><span class="label">Timezone</span><span class="value">${d.timezone}</span></div>
        <div class="row"><span class="label">Apps</span><span class="value">${d.totalApps}</span></div>
      </div>

      <div style="text-align:center;color:#8892b0;font-size:0.7rem;padding:20px 0;opacity:0.6;">
        Device Info Pro © ${new Date().getFullYear()}
      </div>
    `;
  } catch(e) {
    document.getElementById('out').innerHTML = `
      <div class="card">
        <h3>❌ Kosa</h3>
        <div class="row"><span class="value bad">${e.message}</span></div>
      </div>`;
  }
}

function formatBytes(bytes) {
  if (!bytes || bytes <= 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

window.addEventListener('load', () => setTimeout(loadAll, 500));
</script>
</body>
  </html>
